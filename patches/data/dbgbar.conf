# /data/dbgbar.conf -- Engineering Debug Status Bar configuration
# Edited live from the GUI config page, or by hand. The daemon hot-reloads
# this file within one refresh tick (no restart needed).

# --- master ---
enabled      = 1          # 1 = show bar, 0 = fully disabled (zero overhead)
eng_mode     = 0          # advanced 2nd-row diagnostics (toggle live: MENU+9999)
refresh_sec  = 1          # allowed: 1 | 2 | 5 | 10
style        = normal     # compact | normal | developer

# --- individual widgets (1 = show, 0 = hide) ---
w_temp       = 1
w_cpu        = 1
w_ram        = 1
w_uptime     = 1
w_vdec       = 1
w_adec       = 1
w_dmx        = 1
w_signal     = 1
w_codec      = 1
w_res        = 1
w_net        = 1
w_gadget     = 1
w_storage    = 1
