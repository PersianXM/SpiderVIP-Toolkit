[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spidervip-toolkit"
dynamic = ["version"]
description = "SpiderVIP toolkit: A/V freeze diagnose/repair, channel & favorite management, and frequency/TP sync"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
online = ["paramiko>=3.0"]
console = ["flask>=3.0", "requests>=2.31", "beautifulsoup4>=4.12"]
overlay = ["pywebview>=5"]
dev = ["pytest>=7.0"]

[project.scripts]
spidervip = "spidervip.cli:main"

[tool.setuptools.packages.find]
include = ["spidervip*"]

[tool.setuptools.dynamic]
version = {attr = "spidervip._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
