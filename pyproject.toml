[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spidervip-firmware-patch"
version = "0.1.0"
description = "Patch official SpiderVIP (.mupg) firmware with custom improvements (one click)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mupg-patch = "mupgpatch.cli:main"

[tool.setuptools.packages.find]
include = ["mupgpatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
